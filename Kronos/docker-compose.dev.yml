services:
  kronos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kronos-api-dev
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
    volumes:
      # Montar código fuente para desarrollo (hot-reload con --reload)
      - ./src:/app/src
      - ./docs:/app/docs
      - ./pyproject.toml:/app/pyproject.toml
    command: uvicorn kronos.infrastructure.api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kronos-network

networks:
  kronos-network:
    driver: bridge
