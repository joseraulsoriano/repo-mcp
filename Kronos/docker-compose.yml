services:
  kronos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kronos-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=development
    volumes:
      # Montar código fuente para desarrollo (hot-reload)
      - ./src:/app/src:ro
      - ./docs:/app/docs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kronos-network

networks:
  kronos-network:
    driver: bridge
