# Volunteer MCP - levantar con: docker compose up --build
services:
  volunteer-mcp:
    build: .
    ports:
      - "8011:8011"
    environment:
      - DATA_DIR=/app/data
      # Opcionales (descomentar o usar .env):
      # - BRAVE_API_KEY=
      # - REDIS_URL=redis://redis:6379
      # - DATABASE_URL=postgres://...
    volumes:
      - volunteer-data:/app/data
    restart: unless-stopped

volumes:
  volunteer-data:
