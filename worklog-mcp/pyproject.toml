[project]
name = "worklog-mcp"
version = "0.1.0"
description = "MCP server: bitácora de trabajo personal a partir de las sesiones de Claude Code (horas, sesiones, archivos, commits, revisiones y posturas)."
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.scripts]
worklog = "worklog_mcp.cli:main"
worklog-mcp = "worklog_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worklog_mcp"]
